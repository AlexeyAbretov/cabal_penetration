# Публикация игры на GitHub Pages.
# Пуш в любую ветку release/release-<версия> пересобирает все такие ветки:
# выкладка заменяет сайт целиком, поэтому старые версии надо положить в тот же артефакт.
# release/release-0.1 → https://alexeyabretov.github.io/cabal_penetration/0.1/
# Корень сайта — та же сборка, что у самой старшей версии.
# В настройках репозитория источник Pages — GitHub Actions, иначе workflow не выкладывает сайт.
# У vite base должен остаться './': один dist открывается и с корня, и из папки версии.

name: GitHub Pages

on:
  push:
    branches:
      - 'release/release-**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Собрать каждую ветку в свою папку версии
        run: |
          set -euo pipefail
          root="${GITHUB_WORKSPACE}"
          mkdir -p "${root}/site"

          git fetch --depth=1 origin '+refs/heads/release/release-*:refs/remotes/origin/release/release-*'

          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/release/release-*' | sort -V)

          latest=""
          for branch in "${branches[@]}"; do
            version="${branch#release/release-}"
            if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              echo "Пропуск ${branch}: после release/release- нужна версия вроде 0.1"
              continue
            fi

            work="${RUNNER_TEMP}/pages-${version}"
            echo "Сборка ${branch} → /${version}/"
            git worktree add --detach "${work}" "origin/${branch}"
            (
              cd "${work}"
              npm ci
              npm run build
            )
            mkdir -p "${root}/site/${version}"
            cp -a "${work}/dist/." "${root}/site/${version}/"
            git worktree remove --force "${work}"
            latest="${version}"
          done

          if [[ -z "${latest}" ]]; then
            echo "Нет веток release/release-<версия>"
            exit 1
          fi

          echo "Корень сайта — версия ${latest}"
          cp -a "${root}/site/${latest}/." "${root}/site/"
          echo "В корне:"
          ls -1 "${root}/site"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
