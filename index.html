<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cabal</title>
    <style>
      html,
      body,
      #game {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #000;
        overflow: hidden;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
      }

      #game {
        position: relative;
      }

      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }

      /* Цифры HUD живут вне холста: его увеличение режет край в пиксель. */
      .hud-figures {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .hud-figure {
        position: absolute;
        left: 0;
        top: 0;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1;
        white-space: pre;
        transform: translateY(-50%);
      }

      .hud-picture {
        position: absolute;
        top: 0;
        margin: 0;
        padding: 4px 8px;
        border: none;
        background: transparent;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1;
        color: #c2ae84;
        cursor: pointer;
        pointer-events: auto;
        transform: translateY(-50%);
        user-select: none;
      }

      .hud-picture.is-current {
        color: #e7dcc4;
        box-shadow: inset 0 -2px 0 #e7dcc4;
      }

      .pause-menu {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 3;
        display: none;
        flex-direction: column;
        align-items: stretch;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .pause-title {
        margin: 0;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1;
        color: #e7dcc4;
        text-align: center;
        user-select: none;
      }

      .pause-menu.is-open {
        display: flex;
        pointer-events: auto;
      }

      .pause-action {
        margin: 0;
        border-style: solid;
        border-color: #e7dcc4;
        background: #1a140e;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1;
        color: #e7dcc4;
        cursor: pointer;
        white-space: nowrap;
        user-select: none;
      }

      .pause-action:hover,
      .pause-action:focus-visible {
        background: #e7dcc4;
        color: #1a140e;
      }

      .continue-action {
        position: absolute;
        z-index: 3;
        display: none;
        transform: translate(-50%, 0);
        pointer-events: none;
      }

      .continue-action.is-open {
        display: block;
        pointer-events: auto;
      }

      .help-dialog {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: none;
      }

      .help-dialog.is-open {
        display: block;
        background: rgba(0, 0, 0, 0.55);
        pointer-events: auto;
      }

      .help-card {
        position: absolute;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        overflow: hidden;
        background: #1a140e;
        border-style: solid;
        border-color: #e7dcc4;
        transform: translate(-50%, -50%);
      }

      .help-x {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 0;
        border: none;
        background: transparent;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1;
        color: #e7dcc4;
        cursor: pointer;
        user-select: none;
      }

      .help-x:hover,
      .help-x:focus-visible {
        background: #e7dcc4;
        color: #1a140e;
      }

      .help-note {
        margin: 0;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1.2;
        color: #c2ae84;
        text-align: center;
        user-select: none;
      }

      .help-list {
        display: flex;
        flex-direction: column;
      }

      .help-list.is-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .help-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1.25;
        color: #e7dcc4;
        user-select: none;
      }

      .help-key {
        color: #c2ae84;
      }

      .help-act {
        text-align: right;
      }

      .help-list.is-grid .help-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .help-list.is-grid .help-act {
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
