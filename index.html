<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cabal</title>
    <style>
      html,
      body,
      #game {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #000;
        overflow: hidden;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
      }

      #game {
        position: relative;
        z-index: 0;
      }

      input,
      button,
      textarea {
        font-family: inherit;
      }

      /* Полоса до первого кадра. Её рисует страница, а не холст: скрипт ещё не приехал. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        font-family: Consolas, "Courier New", monospace;
        transition: opacity 0.22s ease;
      }

      #boot.is-done {
        opacity: 0;
        pointer-events: none;
      }

      .boot-plate {
        box-sizing: border-box;
        width: min(460px, calc(100% - 24px));
        padding: 22px 16px 18px;
        background: #1a140e;
        border: 4px solid #e7dcc4;
      }

      .boot-title {
        margin: 0;
        color: #e7dcc4;
        font-size: clamp(15px, 4.6vw, 24px);
        font-weight: 400;
        letter-spacing: 0.12em;
        text-align: center;
        white-space: nowrap;
      }

      .boot-label {
        margin: 16px 0 12px;
        color: #c2ae84;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0.16em;
        text-align: center;
        text-transform: uppercase;
      }

      .boot-track {
        height: 12px;
        overflow: hidden;
        background: #000;
        border: 2px solid #c2ae84;
      }

      .boot-fill {
        width: 40%;
        height: 100%;
        background: #e7dcc4;
        animation: boot-slide 1.2s ease-in-out infinite;
      }

      #boot-track.is-known .boot-fill {
        animation: none;
        transform: none;
      }

      @keyframes boot-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(280%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot {
          transition: none;
        }

        .boot-fill {
          width: 100%;
          opacity: 0.35;
          animation: none;
          transform: none;
        }

        #boot-track.is-known .boot-fill {
          opacity: 1;
        }
      }

      /* Портрет на телефоне: кадр крутим на широкую сторону (см. mobile-landscape.ts). */
      html.force-landscape #game {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 100dvh;
        height: 100vw;
        max-width: 100dvh;
        max-height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
      }

      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }

      /* Цифры HUD живут вне холста: его увеличение режет край в пиксель. */
      .hud-figures {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .hud-figure {
        position: absolute;
        left: 0;
        top: 0;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1;
        white-space: pre;
        transform: translateY(-50%);
      }

      .hud-picture {
        position: absolute;
        top: 0;
        margin: 0;
        padding: 4px 8px;
        border: none;
        background: transparent;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1;
        color: #c2ae84;
        cursor: pointer;
        pointer-events: auto;
        transform: translateY(-50%);
        user-select: none;
      }

      .hud-picture.is-current {
        color: #e7dcc4;
        box-shadow: inset 0 -2px 0 #e7dcc4;
      }

      .pause-menu {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 3;
        display: none;
        flex-direction: column;
        align-items: stretch;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .pause-title {
        margin: 0;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1;
        color: #e7dcc4;
        text-align: center;
        user-select: none;
      }

      .pause-menu.is-open {
        display: flex;
        pointer-events: auto;
      }

      .pause-action {
        margin: 0;
        border-style: solid;
        border-color: #e7dcc4;
        background: #1a140e;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1;
        color: #e7dcc4;
        cursor: pointer;
        white-space: nowrap;
        user-select: none;
      }

      .pause-action:hover,
      .pause-action:focus-visible {
        background: #e7dcc4;
        color: #1a140e;
      }

      .continue-action {
        position: absolute;
        z-index: 3;
        display: none;
        transform: translate(-50%, 0);
        pointer-events: none;
      }

      .continue-action.is-open {
        display: block;
        pointer-events: auto;
      }

      .help-dialog {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: none;
      }

      .help-dialog.is-open {
        display: block;
        background: rgba(0, 0, 0, 0.55);
        pointer-events: auto;
      }

      .help-card {
        position: absolute;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        overflow: hidden;
        background: #1a140e;
        border-style: solid;
        border-color: #e7dcc4;
        transform: translate(-50%, -50%);
      }

      .help-x {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 0;
        border: none;
        background: transparent;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1;
        color: #e7dcc4;
        cursor: pointer;
        user-select: none;
      }

      .help-x:hover,
      .help-x:focus-visible {
        background: #e7dcc4;
        color: #1a140e;
      }

      .help-note {
        margin: 0;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1.2;
        color: #c2ae84;
        text-align: center;
        user-select: none;
      }

      .help-list {
        display: flex;
        flex-direction: column;
      }

      .help-list.is-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .help-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1.25;
        color: #e7dcc4;
        user-select: none;
      }

      .help-key {
        color: #c2ae84;
      }

      .help-act {
        text-align: right;
      }

      .help-list.is-grid .help-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .help-list.is-grid .help-act {
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">
      <div class="boot-plate">
        <p class="boot-title">CABAL</p>
        <p id="boot-label" class="boot-label">Загрузка</p>
        <div
          id="boot-track"
          class="boot-track"
          role="progressbar"
          aria-label="Загрузка"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div id="boot-fill" class="boot-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
