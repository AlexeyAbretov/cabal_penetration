<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cabal</title>
    <style>
      html,
      body,
      #game {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #000;
        overflow: hidden;
      }

      #game {
        position: relative;
      }

      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* Цифры HUD живут вне холста: его увеличение режет край в пиксель. */
      .hud-figures {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .hud-figure {
        position: absolute;
        left: 0;
        top: 0;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1;
        white-space: pre;
        transform: translateY(-50%);
      }

      .hud-picture {
        position: absolute;
        top: 0;
        margin: 0;
        padding: 4px 8px;
        border: none;
        background: transparent;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        line-height: 1;
        color: #c2ae84;
        cursor: pointer;
        pointer-events: auto;
        transform: translateY(-50%);
        user-select: none;
      }

      .hud-picture.is-current {
        color: #e7dcc4;
        box-shadow: inset 0 -2px 0 #e7dcc4;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
